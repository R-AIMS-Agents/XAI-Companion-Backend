<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="title">
  <title id="title">The Unity client exchanges audio and data with the Pipecat agent (STT, LLM, TTS) through the LiveKit server; the agent writes the session logs.</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; text-anchor: middle; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; fill: #59636e; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .agent { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
    .stage { fill: #ffffff; stroke: #54aeff; stroke-width: 1.5; }
    .link { stroke: #818b98; stroke-width: 1.5; fill: none; }
    .head { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .sub, .label { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .agent { fill: #0d2a4f; stroke: #1f6feb; }
      .stage { fill: #0d1117; stroke: #1f6feb; }
      .link { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="40" width="170" height="64" rx="8"/>
  <text class="name" x="95" y="68">Unity client</text>
  <text class="sub" x="95" y="88">VR/AR headset</text>

  <line class="link" x1="184" y1="72" x2="296" y2="72" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="240" y="62">audio and data</text>

  <rect class="box" x="300" y="40" width="170" height="64" rx="8"/>
  <text class="name" x="385" y="77">LiveKit server</text>

  <line class="link" x1="474" y1="72" x2="596" y2="72" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="535" y="62">audio and data</text>

  <rect class="agent" x="600" y="20" width="250" height="92" rx="8"/>
  <text class="name" x="725" y="44">Agent (Pipecat)</text>
  <rect class="stage" x="614" y="62" width="56" height="36" rx="6"/>
  <text x="642" y="85" font-size="13">STT</text>
  <line class="link" x1="672" y1="80" x2="695" y2="80" marker-end="url(#arrow)"/>
  <rect class="stage" x="697" y="62" width="56" height="36" rx="6"/>
  <text x="725" y="85" font-size="13">LLM</text>
  <line class="link" x1="755" y1="80" x2="778" y2="80" marker-end="url(#arrow)"/>
  <rect class="stage" x="780" y="62" width="56" height="36" rx="6"/>
  <text x="808" y="85" font-size="13">TTS</text>

  <line class="link" x1="725" y1="112" x2="725" y2="150" marker-end="url(#arrow)"/>
  <rect class="box" x="660" y="154" width="130" height="36" rx="8"/>
  <text class="name" x="725" y="177">Session logs</text>
</svg>
