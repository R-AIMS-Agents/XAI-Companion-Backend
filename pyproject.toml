[project]
name = "xai-companion"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "pipecat-ai[livekit,mistral,kokoro,whisper]>=1.15.0",
    "livekit>=1.1.19",
    "livekit-api>=1.2.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.3",
    "sv-ttk>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "sounddevice>=0.5.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: needs a running agent, run with `uv run pytest -m live`"]
